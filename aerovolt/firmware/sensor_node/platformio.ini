; =========================================================================================
; AeroVolt sensor node - PlatformIO project
; =========================================================================================
;   pio run -e nano_serial -t upload     Phase-2 bench node: Arduino Nano, one SDP + BME280,
;                                        $AV lines over USB serial (no CAN)
;   pio run -e teensy41 -t upload        front aero node on a Teensy 4.1: CAN (FlexCAN_T4) + USB serial
;   pio run -e esp32dev -t upload        front aero node on an ESP32 DevKit: CAN (TWAI) + USB serial
;   pio device monitor -b 115200         watch the $AV / $AVH / $AVS lines
;
; What is connected where (channel ids, mux channels, I2C addresses, pins, calibration):
; include/node_config.h. The CAN layout is include/aerovolt_can.h, GENERATED from
; config/can_layout.yaml by tools/gen_can.py - never edit it by hand.
;
; Choose a profile per build with -D NODE_PROFILE=NODE_PROFILE_AERO_FRONT or
; NODE_PROFILE_BENCH_ONE_TAP, and the outputs with -D AV_USE_CAN=0/1 and -D AV_USE_SERIAL=0/1.
;
; All drivers (Sensirion SDP, TCA9548A, BME280, HX711) are our own code in src/drivers and
; lib/avcore - no third-party sensor libraries. The only external library is FlexCAN_T4,
; which ships with Teensyduino (part of the teensy platform).
; The portable core lib/avcore is unit tested on the PC:
;   make -C test/host test
; =========================================================================================

[platformio]
default_envs = nano_serial

[env]
framework = arduino
monitor_speed = 115200
; evaluate #if/#ifdef when looking for libraries (the CAN drivers are board-specific)
lib_ldf_mode = chain+
; C++17 everywhere (the Arduino cores default to gnu++11/14); -I include also gives
; lib/avcore access to the generated aerovolt_can.h
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I include

[env:teensy41]
platform = teensy
board = teensy41
build_flags =
    ${env.build_flags}
    -D NODE_PROFILE=NODE_PROFILE_AERO_FRONT
    -D AV_USE_CAN=1
    -D AV_USE_SERIAL=1

[env:esp32dev]
platform = espressif32
board = esp32dev
monitor_filters = esp32_exception_decoder
build_flags =
    ${env.build_flags}
    -D NODE_PROFILE=NODE_PROFILE_AERO_FRONT
    -D AV_USE_CAN=1
    -D AV_USE_SERIAL=1

[env:nano_serial]
platform = atmelavr
; Most Nano boards (and clones) sold today have the "new" bootloader (115200 baud upload).
; If upload fails with "not in sync", use: board = nanoatmega328
board = nanoatmega328new
; ATmega328P: 2 KB RAM, no heap use, no CAN controller -> serial only
build_flags =
    ${env.build_flags}
    -D NODE_PROFILE=NODE_PROFILE_BENCH_ONE_TAP
    -D AV_USE_CAN=0
    -D AV_USE_SERIAL=1

# Off-site copies of Linear Hub's encrypted backups (written by deploy/install.sh; run it again to change these).
# Read by /usr/local/lib/linear-hub/offsite-sync.sh and the linear-hub command. No secrets here: the store's
# password or key lives in the rclone settings of the service user.
OFFSITE_ENABLED=@ENABLED@
OFFSITE_TARGET=@TARGET@
OFFSITE_DIR=@OFFSITE_DIR@
MEDIA_DIR=@MEDIA_DIR@
RCLONE_CONF=@RCLONE_CONF@
STATUS_FILE=@STATUS_FILE@
HEARTBEAT_URL=@HEARTBEAT_URL@

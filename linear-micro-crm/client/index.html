<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F6FA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1020" />
    <meta name="description" content="Linear Hub — the Linear MCR team platform for field gauges, recruitment and pay." />
    <meta name="application-name" content="Linear Hub" />
    <meta name="apple-mobile-web-app-title" content="Linear Hub" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- iOS uses a PNG for the home-screen icon (an SVG gives a screenshot of the page instead) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Linear Hub</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // 'lm-theme' is 'light' | 'dark' | 'system' (or absent = system).
      try {
        var t = localStorage.getItem('lm-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = t === 'dark' || ((t === null || t === 'system') && prefersDark);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Linear Hub needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

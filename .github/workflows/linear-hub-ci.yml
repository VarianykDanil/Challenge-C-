name: Linear Hub CI

on:
  push:
    paths: ['linear-micro-crm/**', '.github/workflows/linear-hub-ci.yml']
  pull_request:
    paths: ['linear-micro-crm/**', '.github/workflows/linear-hub-ci.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: linear-micro-crm
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: linear-micro-crm/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and route tests (shared logic and server)
        run: npm test
      - name: API smoke test
        run: npm run smoke -w server
      - name: Build client
        run: npm run build
      - name: Docker image builds
        run: docker build -t linear-hub:ci .

  boot:
    name: boot (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '26.8.1', '26']
    defaults:
      run:
        working-directory: linear-micro-crm
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: linear-micro-crm/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build client
        run: npm run build
      - name: Doctor (boots the server on a temporary database and checks it stays up)
        run: npm run doctor
      - name: npm start stays up for 8 seconds and serves the landing page
        shell: bash
        run: |
          PORT=4123 npm start > start.log 2>&1 &
          for i in $(seq 1 40); do grep -q "listening on" start.log && break; sleep 0.5; done
          sleep 8
          cat start.log
          grep -q "listening on http://localhost:4123" start.log
          if ! kill -0 $! 2>/dev/null; then echo "::error::server exited after listening"; exit 1; fi
          curl -sf -o /dev/null -w "landing %{http_code}\n" http://localhost:4123/
          curl -sf http://localhost:4123/api/health
          PORT=4123 npm run share | tee share.log
          grep -Eq "http://[0-9.]+:4123" share.log
          pkill -TERM -f "node src/index.ts"
          wait $! || true
          sleep 1
          cat start.log
          grep -q "Received SIGTERM: shutting down" start.log
      - name: npm start refuses a port something else already holds (exit 1, names the holder)
        shell: bash
        run: |
          node -e "require('net').createServer(()=>{}).listen(4124,'0.0.0.0',()=>setTimeout(()=>{},60000))" &
          HOLDER=$!
          sleep 1
          set +e
          PORT=4124 npm start > busy.log 2>&1
          CODE=$?
          set -e
          kill $HOLDER || true
          cat busy.log
          test "$CODE" -ne 0 || { echo "::error::npm start exited 0 although port 4124 was taken"; exit 1; }
          grep -q "Port 4124 is already in use" busy.log
          ! grep -q "listening on" busy.log
      - name: a second npm start recognises the running copy, and npm run stop ends it
        shell: bash
        run: |
          PORT=4125 npm start > first.log 2>&1 &
          for i in $(seq 1 40); do grep -q "listening on" first.log && break; sleep 0.5; done
          set +e
          PORT=4125 npm start > second.log 2>&1
          CODE=$?
          set -e
          cat second.log
          test "$CODE" -ne 0
          grep -q "earlier copy of Linear Hub" second.log
          PORT=4125 npm run stop | tee stop.log
          grep -q "Port 4125 is free" stop.log
          sleep 1
          cat first.log
          grep -q "Received SIGTERM: shutting down" first.log

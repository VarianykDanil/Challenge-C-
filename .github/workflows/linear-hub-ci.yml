name: Linear Hub CI

on:
  push:
    paths: ['linear-micro-crm/**', '.github/workflows/linear-hub-ci.yml', '.github/dependabot.yml']
  pull_request:
    paths: ['linear-micro-crm/**', '.github/workflows/linear-hub-ci.yml', '.github/dependabot.yml']
  # Every Monday as well, with no code change: a new security advisory, or a test that only passed on the day it was
  # written, shows up here before it surprises anyone in a pull request. (GitHub runs schedules from the default
  # branch only.)
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linear-hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything on Linux and on a Mac (the trial runs on the office Mac, go-live on a Linux server)
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: linear-micro-crm
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: linear-micro-crm/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: package-lock.json matches package.json
        # A lockfile that disagrees with package.json is rewritten by every npm install, and that local change then
        # blocks the next git pull on the owner's Mac. Fail here instead.
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json || { echo "::error::package-lock.json is out of sync with package.json: run npm install --package-lock-only and commit it"; exit 1; }
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and route tests (shared logic and server)
        run: npm test
      - name: Extra loopback addresses the smoke test sends from as other devices (a Mac has only 127.0.0.1)
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up && sudo ifconfig lo0 alias 127.0.0.3 up
      - name: API smoke test
        run: npm run smoke -w server
      - name: Build client
        run: npm run build
      - name: Docker image builds
        if: runner.os == 'Linux'
        run: docker build -t linear-hub:ci .

  # Known security problems in the packages the app runs with. High or critical fails the build; the full report
  # (tools included) is printed for information.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: linear-micro-crm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: npm audit (production dependencies, fails on high or critical)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (everything, for information)
        if: always()
        run: npm audit || true

  # The whole suite again at five awkward moments ahead (the Sunday the clocks go forward, a year end at night, a
  # Sunday night in January, midnight starting a summer-time Monday, and the business clock alone moved as
  # LM_BUSINESS_NOW does), so a test that only passes on today's date, or only when the two clocks agree, fails now
  # instead of on that day. `npm run test:dates -- --list` prints them.
  dates:
    name: tests on other dates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: linear-micro-crm
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: linear-micro-crm/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: npm test at five other moments
        run: npm run test:dates

  boot:
    name: boot (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '26.8.1', '26']
    defaults:
      run:
        working-directory: linear-micro-crm
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: linear-micro-crm/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build client
        run: npm run build
      - name: Doctor (boots the server on a temporary database and checks it stays up)
        run: npm run doctor
      - name: npm start stays up for 8 seconds and serves the landing page
        shell: bash
        run: |
          PORT=4123 npm start > start.log 2>&1 &
          for i in $(seq 1 40); do grep -q "listening on" start.log && break; sleep 0.5; done
          sleep 8
          cat start.log
          grep -q "listening on http://localhost:4123" start.log
          if ! kill -0 $! 2>/dev/null; then echo "::error::server exited after listening"; exit 1; fi
          curl -sf -o /dev/null -w "landing %{http_code}\n" http://localhost:4123/
          curl -sf http://localhost:4123/api/health
          PORT=4123 npm run share | tee share.log
          grep -Eq "http://[0-9.]+:4123" share.log
          pkill -TERM -f "node src/index.ts"
          wait $! || true
          sleep 1
          cat start.log
          grep -q "Received SIGTERM: shutting down" start.log
      - name: npm start refuses a port something else already holds (exit 1, names the holder)
        shell: bash
        run: |
          node -e "require('net').createServer(()=>{}).listen(4124,'0.0.0.0',()=>setTimeout(()=>{},60000))" &
          HOLDER=$!
          sleep 1
          set +e
          PORT=4124 npm start > busy.log 2>&1
          CODE=$?
          set -e
          kill $HOLDER || true
          cat busy.log
          test "$CODE" -ne 0 || { echo "::error::npm start exited 0 although port 4124 was taken"; exit 1; }
          grep -q "Port 4124 is already in use" busy.log
          ! grep -q "listening on" busy.log
      - name: a second npm start recognises the running copy, and npm run stop ends it
        shell: bash
        run: |
          PORT=4125 npm start > first.log 2>&1 &
          for i in $(seq 1 40); do grep -q "listening on" first.log && break; sleep 0.5; done
          set +e
          PORT=4125 npm start > second.log 2>&1
          CODE=$?
          set -e
          cat second.log
          test "$CODE" -ne 0
          grep -q "earlier copy of Linear Hub" second.log
          PORT=4125 npm run stop | tee stop.log
          grep -q "Port 4125 is free" stop.log
          sleep 1
          cat first.log
          grep -q "Received SIGTERM: shutting down" first.log

# Weekly dependency updates for Linear Hub. Each week Dependabot opens at most a few pull requests, and CI checks
# every one of them on Linux and Mac before anyone merges it. Security fixes come as soon as an advisory is published
# (switch on "Dependabot security updates" in the repository's Settings → Code security).
# GitHub reads this file from the repository's default branch only, so it takes effect once Linear Hub's branch is the
# default branch (Settings → General → Default branch) or the app has a repository of its own.
version: 2
updates:
  # The npm workspace (shared, server, client): one lockfile in linear-micro-crm/
  - package-ecosystem: npm
    directory: /linear-micro-crm
    schedule:
      interval: weekly
      day: monday
      time: "07:13"
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # Patch and minor updates arrive together, one pull request for the app and one for the tools.
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
      # Security fixes for any package arrive together too.
      security:
        applies-to: security-updates
        patterns: ["*"]
    # Major versions (zod 5, vite 9, ...) still come one at a time, so each can be read and tested on its own.

  # The actions the CI workflow uses (checkout, setup-node)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:13"
      timezone: Europe/London
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
